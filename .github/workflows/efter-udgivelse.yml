# winget og Homebrew efter en udgivelse: release.yml (og windows-signeret.yml) starter det, når versionsmærkets udgivelse er
# udgivet. Det indsender winget-manifesterne fra udgivelsen til microsoft/winget-pkgs (wingetcreate, som en pull request fra
# en fork på nøglens konto) og skubber Homebrew-cask'en, lavet ud fra udgivelsens dmg'er, til tap'en rpaasch/homebrew-tap.
# Nøglen er hemmeligheden WINGET_HOMEBREW_TOKEN i miljøet winget-homebrew: en klassisk personlig adgangsnøgle med
# public_repo og workflow (wingetcreate tager ikke de nye fine-grained nøgler). Miljøet giver kun nøglen til workflows på
# master og, med påkrævet godkendelse, først når ejeren har godkendt kørslen (se docs/superpowers/udgiv-paa-github.md i
# dev-repoet). Uden nøglen springes winget og Homebrew over (gem den og kør workflowet igen, eller send med udgiv.ps1). Er
# versionen allerede i winget-pkgs, eller er der en åben pull request for den, springes winget over; har tap'en den eller en
# nyere, springes Homebrew over. Kan derfor køres igen.
#
#   gh workflow run efter-udgivelse.yml -R rpaasch/AulaSync -f tag=v3.3.0
name: winget og Homebrew

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versionsmærket (fx v3.3.0); udgivelsen skal være udgivet
        required: true

permissions:
  contents: read

concurrency:
  group: efter-udgivelse-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  TAP: rpaasch/homebrew-tap

jobs:
  tjek:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: v
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Ugyldigt versionsmærke: $TAG"; exit 1; fi
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::$TAG er ikke udgivet endnu."; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  winget:
    needs: tjek
    runs-on: windows-latest
    environment: winget-homebrew
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.tjek.outputs.version }}
      HAS_TOKEN: ${{ secrets.WINGET_HOMEBREW_TOKEN != '' }}
    steps:
      # Findes versionen allerede i winget-pkgs, eller er der en åben pull request for den, sendes den ikke igen.
      - name: Er versionen allerede indsendt?
        id: findes
        env:
          GH_TOKEN: ${{ secrets.WINGET_HOMEBREW_TOKEN }}
        run: |
          if ($env:HAS_TOKEN -ne 'true') {
            '::notice::Hemmeligheden WINGET_HOMEBREW_TOKEN mangler i miljøet winget-homebrew, så winget springes over (gem den og tryk Re-run all jobs, eller send med udgiv.ps1).'
            'skip=true' >> $env:GITHUB_OUTPUT; exit 0
          }
          $ErrorActionPreference = 'Continue'
          gh api "repos/microsoft/winget-pkgs/contents/manifests/r/rpaasch/AulaSync/$env:VERSION" --silent 2> $null
          $merged = $LASTEXITCODE -eq 0
          $open = gh pr list -R microsoft/winget-pkgs --state open --search "rpaasch.AulaSync $env:VERSION in:title" --json number --jq length
          if ($LASTEXITCODE -ne 0) { Write-Error 'Kunne ikke søge i pull requests i microsoft/winget-pkgs.'; exit 1 }
          if ($merged -or [int]$open -gt 0) { "Version $env:VERSION er allerede i winget-pkgs eller har en åben pull request; springes over." }
          "skip=$($merged -or [int]$open -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          exit 0
      - name: Hent manifesterne fra udgivelsen
        if: steps.findes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p "winget-manifests-$env:VERSION.zip" -D winget
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive "winget/winget-manifests-$env:VERSION.zip" winget -Force
          if (-not (Test-Path "winget/manifests/r/rpaasch/AulaSync/$env:VERSION/rpaasch.AulaSync.yaml")) { throw 'Zip-filen har ikke manifesterne for versionen.' }
      # Nøglen gives i miljøvariablen, som wingetcreate læser (med --token kan den havne i loggen).
      - name: Indsend til winget
        if: steps.findes.outputs.skip != 'true'
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_HOMEBREW_TOKEN }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --no-open --prtitle "New version: rpaasch.AulaSync version $env:VERSION" "winget/manifests/r/rpaasch/AulaSync/$env:VERSION"
          if ($LASTEXITCODE) { throw "wingetcreate fejlede ($LASTEXITCODE)." }

  homebrew:
    needs: tjek
    runs-on: ubuntu-latest
    environment: winget-homebrew
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.tjek.outputs.version }}
      HAS_TOKEN: ${{ secrets.WINGET_HOMEBREW_TOKEN != '' }}
    steps:
      # Homebrew først fra 3.2.1, hvor Afinstallér AulaSync… også rydder Homebrews optegnelse (som i udgiv.ps1).
      - name: Nøglen og versionen
        id: tjek
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice::Hemmeligheden WINGET_HOMEBREW_TOKEN mangler i miljøet winget-homebrew, så Homebrew springes over (gem den og tryk Re-run all jobs, eller send med udgiv.ps1)."
            echo skip=true >> "$GITHUB_OUTPUT"
          elif [ "$(printf '3.2.1\n%s\n' "$VERSION" | sort -V | head -n 1)" != 3.2.1 ]; then
            echo "::notice::Homebrew kræver AulaSync 3.2.1 eller nyere; $VERSION springes over."
            echo skip=true >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.tjek.outputs.skip != 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Hent dmg'erne fra udgivelsen
        if: steps.tjek.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "AulaSync-$VERSION-*.dmg" -D dmg
      # Cask'en og tap'ens README; tap'en oprettes første gang. Har tap'en en nyere version (fx når en ældre versions
      # kørsel køres igen), eller ingen ændringer, skubbes intet.
      - name: Opdatér tap'en
        if: steps.tjek.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_HOMEBREW_TOKEN }}
        run: |
          if ! gh repo view "$TAP" --json name > /dev/null 2>&1; then
            gh repo create "$TAP" --public --description 'Homebrew-tap til AulaSync: brew install --cask rpaasch/tap/aulasync'
          fi
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/$TAP.git" tap
          old=$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Casks/aulasync.rb 2> /dev/null || true)
          if [ -n "$old" ] && [ "$old" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$old" "$VERSION" | sort -V | tail -n 1)" = "$old" ]; then
            echo "::notice::$TAP har den nyere $old; $VERSION springes over."; exit 0
          fi
          mkdir -p tap/Casks
          pwsh packaging/homebrew/make-cask.ps1 "$VERSION" "dmg/AulaSync-$VERSION-arm64.dmg" "dmg/AulaSync-$VERSION-x64.dmg" "$GITHUB_REPOSITORY" tap/Casks/aulasync.rb
          cp packaging/homebrew/tap-README.md tap/README.md
          cd tap
          git add -A
          if git diff --cached --quiet; then echo "$TAP har allerede $VERSION."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "aulasync $VERSION"
          git push -q origin HEAD
          echo "$TAP har nu $VERSION."
